<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lineup — Cards &amp; Chips</title>
<style>
  :root{
    --bg:#0b1324; --panel:#121d36; --panel2:#1a2848; --ink:#eef2fb; --muted:#93a3c4;
    --card:#fbf7ec; --cardInk:#1b2233; --red:#c8202f; --focus:#ffd34d;
    --blue:#3b82f6; --green:#22c55e; --redchip:#ef4444;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:radial-gradient(ellipse at 35% 45%,#16233f 0%,#0b1324 60%,#060b16 100%);color:var(--ink);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
  /* TV-safe area: ~3% padding for overscan */
  #app{position:absolute;inset:3vh 3vw;display:flex;gap:2.5vw;align-items:center;justify-content:center}
  .hidden{display:none!important}

  /* ---------- Board ---------- */
  #board{height:92vh;width:92vh;max-width:62vw;max-height:62vw;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);gap:.55vh;padding:1.3vh;
    background:radial-gradient(circle at 50% 42%,#227a52 0%,#145a3b 55%,#0b3826 100%);
    border:1.1vh solid #6b4423;border-radius:2vh;
    box-shadow:0 0 0 .35vh #2b1a0c,inset 0 0 3vh rgba(0,0,0,.45),0 2vh 5vh rgba(0,0,0,.6)}
  .cell{position:relative;background:linear-gradient(170deg,#fffdf7 0%,#f3ebd8 100%);color:#1f2433;border-radius:.8vh;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;font-weight:800;
    box-shadow:0 .25vh .45vh rgba(0,0,0,.35),inset 0 0 0 .15vh rgba(0,0,0,.06);transition:transform .14s,filter .14s,box-shadow .14s}
  .cell .rk{font-size:2.7vh;letter-spacing:-.1vh}
  .cell .st{font-size:2.5vh;margin-top:.3vh}
  .cell.red{color:#c62835}
  .cell.corner{background:radial-gradient(circle at 40% 35%,#ffe9a3,#e0b04a 60%,#b9842a);color:#5c3b06;box-shadow:0 .25vh .45vh rgba(0,0,0,.35),inset 0 0 0 .25vh rgba(255,255,255,.35)}
  .cell.corner .star{font-size:3.4vh}
  .cell.corner .free{font-size:1.2vh;letter-spacing:.25vh;margin-top:.2vh;font-weight:900}
  .cell.legal{box-shadow:0 0 0 .4vh #34d399,0 0 1.6vh rgba(52,211,153,.75);transform:translateY(-.2vh);z-index:2}
  .cell.dim{filter:saturate(.35) brightness(.58)}
  .cell.cursor{box-shadow:0 0 0 .55vh var(--focus),0 0 2.6vh rgba(255,211,77,.9);z-index:4;transform:scale(1.16)}
  .cell.last::after{content:"";position:absolute;inset:-.35vh;border:.35vh solid rgba(255,255,255,.9);border-radius:1vh;pointer-events:none;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
  .chip{position:absolute;width:74%;height:74%;border-radius:50%;
    box-shadow:0 .45vh .7vh rgba(0,0,0,.5),inset 0 -.45vh .6vh rgba(0,0,0,.3),inset 0 .35vh .5vh rgba(255,255,255,.35);
    animation:drop .22s ease-out}
  .chip::before{content:"";position:absolute;inset:17%;border-radius:50%;border:.3vh dashed rgba(255,255,255,.65)}
  .chip.locked{box-shadow:0 0 0 .4vh #ffd34d,0 0 1.6vh rgba(255,211,77,.85),inset 0 -.45vh .6vh rgba(0,0,0,.3)}
  .chip.locked::after{content:"★";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff7d6;font-size:2.2vh;text-shadow:0 .2vh .3vh rgba(0,0,0,.5)}
  @keyframes drop{from{transform:scale(1.5);opacity:0}to{transform:scale(1);opacity:1}}

  /* ---------- Side panel ---------- */
  #side{width:30vw;height:92vh;display:flex;flex-direction:column;gap:2vh}
  .title{font-size:4.6vh;font-weight:800;letter-spacing:.2vh}
  .title span{color:var(--focus)}
  .box{background:linear-gradient(180deg,rgba(30,46,82,.92),rgba(18,29,54,.92));border:.15vh solid rgba(255,255,255,.06);border-radius:1.4vh;padding:2vh}
  #scores{display:flex;flex-direction:column;gap:1.2vh}
  .pl{display:flex;align-items:center;gap:1.4vh;font-size:2.6vh;padding:.9vh 1.2vh;border-radius:1vh}
  .pl.active{background:var(--panel2);box-shadow:inset .5vh 0 0 var(--focus)}
  .dot{width:3vh;height:3vh;border-radius:50%;border:.3vh solid rgba(255,255,255,.7)}
  .pl .who{flex:1}
  .pl .seq{font-weight:800}
  #status{font-size:2.6vh;min-height:7vh;line-height:1.35}
  #hand{display:flex;flex-wrap:wrap;gap:1.2vh;justify-content:center}
  .hc{width:7.6vh;height:11vh;background:linear-gradient(170deg,#fffdf7,#efe6d1);box-shadow:0 .5vh 1vh rgba(0,0,0,.45);color:var(--cardInk);border-radius:1vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;position:relative;transition:transform .12s}
  .hc .rk{font-size:3.8vh}.hc .st{font-size:3.4vh}
  .hc.red{color:#c62835}
  .hc .tag{position:absolute;bottom:.6vh;font-size:1.2vh;letter-spacing:.1vh;text-transform:uppercase;background:#1b2233;color:#fff;padding:.2vh .6vh;border-radius:.5vh}
  .hc.dead{opacity:.55}
  .hc.focus{outline:.6vh solid var(--focus);outline-offset:.3vh;transform:translateY(-1.2vh) scale(1.08)}
  .hc.selected{outline:.6vh solid #34d399;outline-offset:.3vh;transform:translateY(-1.2vh)}
  .hc.back{background:repeating-linear-gradient(45deg,#24365f 0 1vh,#1c2a4b 1vh 2vh);border:.4vh solid #3a4f80}
  #hint{font-size:1.9vh;color:var(--muted);line-height:1.6;margin-top:auto}
  kbd{background:#2a3a62;color:#fff;border-radius:.5vh;padding:.1vh .7vh;font-family:inherit;font-weight:700}

  /* ---------- Overlays / menus ---------- */
  .overlay{position:fixed;inset:0;background:rgba(5,10,22,.86);display:flex;align-items:center;justify-content:center;z-index:20}
  .dialog{background:var(--panel);border-radius:2vh;padding:5vh 6vh;min-width:56vh;text-align:center;box-shadow:0 2vh 6vh rgba(0,0,0,.6)}
  .dialog h1{font-size:7vh;font-weight:900;letter-spacing:.3vh}
  .dialog h1 span{color:var(--focus)}
  .dialog h2{font-size:4.4vh;margin-bottom:1vh}
  .dialog p{font-size:2.4vh;color:var(--muted);margin:1vh 0 3vh}
  .opt{font-size:3vh;padding:1.4vh 2.4vh;margin:1.1vh 0;border-radius:1.2vh;background:var(--panel2);display:flex;justify-content:space-between;gap:4vh;border:.4vh solid transparent}
  .opt .val{color:var(--focus);font-weight:800}
  .opt.btn{justify-content:center;font-weight:800}
  .opt.focus{border-color:var(--focus);background:#22355f}
  .rules{text-align:left;font-size:2.3vh;line-height:1.6;color:#d4dcef;max-width:80vh}
  .rules li{margin-left:3vh}
  #toast{position:fixed;left:50%;bottom:5vh;transform:translateX(-50%);background:#22355f;border:.3vh solid var(--focus);padding:1.4vh 3vh;border-radius:1.2vh;font-size:2.6vh;z-index:30;transition:opacity .3s}
  @keyframes shake{0%,100%{transform:scale(1.12) translateX(0)}25%{transform:scale(1.12) translateX(-.6vh)}75%{transform:scale(1.12) translateX(.6vh)}}
  .shake{animation:shake .25s}
  /* ---------- Teams panel ---------- */
  .team{display:flex;align-items:center;gap:1.4vh;padding:1vh 1.2vh;border-radius:1vh}
  .team.active{background:var(--panel2);box-shadow:inset .5vh 0 0 var(--focus)}
  .team .who{flex:1;min-width:0}
  .team .tname{font-size:2.6vh;font-weight:800}
  .team .mem{font-size:2vh;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .team .mem b{color:var(--ink)}
  .team .mem .off{opacity:.5}
  .team .seq{font-size:2.6vh;font-weight:800}
  #joinBox{display:flex;align-items:center;gap:2vh}
  #joinBox .qr svg,#joinBox .qr img{width:15vh;height:15vh;display:block;border-radius:1vh}
  #joinBox .txt{font-size:2vh;color:var(--muted);line-height:1.5}
  #joinBox .txt b{color:var(--focus);font-size:3vh;letter-spacing:.4vh}

  /* ---------- Lobby ---------- */
  #lobby{position:absolute;inset:4vh 4vw;display:flex;gap:5vw;align-items:center;justify-content:center}
  .lobby-left{display:flex;flex-direction:column;align-items:center;gap:1.6vh;text-align:center}
  .lobby-left .title{font-size:8vh;font-weight:900;letter-spacing:.4vh}
  #qr{background:#fff;padding:1.6vh;border-radius:2vh;box-shadow:0 2vh 5vh rgba(0,0,0,.5)}
  #qr svg,#qr img{width:40vh;height:40vh;display:block}
  .scan{font-size:3.4vh;font-weight:800}
  #joinUrl{font-size:1.9vh;color:var(--muted);max-width:52vh;word-break:break-all}
  .code{font-size:2.6vh;color:var(--muted)}
  .code b{font-size:5vh;color:var(--focus);letter-spacing:.8vh;margin-left:1vh}
  #netStatus{font-size:2.1vh;color:var(--muted);min-height:3vh;max-width:56vh}
  .lobby-right{width:46vw;display:flex;flex-direction:column;gap:2.4vh}
  #teamCols{display:flex;gap:2vh}
  .tcol{flex:1;background:linear-gradient(180deg,rgba(30,46,82,.92),rgba(18,29,54,.92));border-radius:1.6vh;padding:2vh;border-top:.8vh solid}
  .tcol h3{font-size:3.2vh;margin-bottom:1.4vh}
  .slot{font-size:2.6vh;padding:1.2vh 1.4vh;margin:.8vh 0;border-radius:1vh;background:rgba(255,255,255,.06);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .slot.empty{color:var(--muted);font-style:italic;background:transparent;border:.2vh dashed rgba(255,255,255,.18)}
  .slot.cpu{color:var(--muted)}
  #lobbyMenu .opt{margin:1vh 0}
  .lobby-note{font-size:2vh;color:var(--muted);line-height:1.5}
</style>
</head>
<body>

<div id="lobby">
  <div class="lobby-left">
    <div class="title">LINE<span>UP</span></div>
    <div id="qr"></div>
    <div class="scan">Scan with your phone to join</div>
    <div id="joinUrl"></div>
    <div class="code">Room<b id="roomCode">····</b></div>
    <div id="netStatus">Opening a room…</div>
  </div>
  <div class="lobby-right">
    <div id="teamCols"></div>
    <div class="lobby-note">Up to 2 players per team. Teams with nobody on them are played by the CPU. Pick your team on your phone.</div>
    <div id="lobbyMenu"></div>
  </div>
</div>

<div id="app" class="hidden">
  <div id="board"></div>
  <div id="side">
    <div class="title">LINE<span>UP</span></div>
    <div class="box" id="scores"></div>
    <div class="box" id="status"></div>
    <div class="box" id="handBox"><div id="hand"></div></div>
    <div class="box hidden" id="joinBox"><div class="qr" id="qrSmall"></div><div class="txt">Your cards are on your phone.<br>Lost connection? Scan again.<br>Room <b id="roomCode2"></b></div></div>
    <div id="hint"></div>
  </div>
</div>

<div id="menu" class="overlay hidden"><div class="dialog" id="menuBox"></div></div>
<div id="toast" class="hidden"></div>

<script src="vendor/qrcode.js"></script>
<script src="common.js"></script>
<script>
(() => {
'use strict';
const { N, SUITS, RANKS, COLORS, DIRS, LAYOUT, rankOf, suitOf, isRed, isJack, isTwoEyed, isOneEyed, isCorner, cardLabel } = LINEUP;
const $ = id => document.getElementById(id);
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function makeDeck(){ const d=[]; for(let k=0;k<2;k++) for(const s of 'SCDH'){ for(const r of RANKS) d.push(r+s); d.push('J'+s); } return shuffle(d); }
const HAND_SIZE = {1:7, 2:7, 3:6, 4:6, 5:5, 6:5};
const MAX_PER_TEAM = 2;

// ---------------- State ----------------
let G = null;                 // current game
let mode = 'phones';          // 'phones' | 'local'
const lobby = { teamsN: 2, clients: new Map() };   // clientId -> {id,name,team,conn,connected}
const localCfg = { teamsN: 2, kinds: ['Human','CPU','CPU'] };
let host = null, roomCode = '', joinURL = '', netReady = false;
let ui = { screen: 'lobby', menuKind: null, menuIdx: 0, lobbyIdx: 0, prevMenu: null };
let newsId = 0;

// ---------------- Room / networking ----------------
function genCode(){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ'; let s=''; for(let i=0;i<4;i++) s+=A[Math.floor(Math.random()*A.length)]; return s; }
function startHosting(){
  roomCode = genCode();
  const base = location.href.split('#')[0].split('?')[0].replace(/[^/]*$/, '');
  joinURL = base + 'play.html?room=' + roomCode + (Net.kind()==='bc' ? '&net=bc' : '');
  $('roomCode').textContent = roomCode; $('roomCode2').textContent = roomCode;
  $('joinUrl').textContent = joinURL.replace(/^https?:\/\//,'');
  drawQR();
  setNet('Opening a room…');
  host = Net.host(roomCode, {
    open(){ netReady = true; setNet('Room is open — scan the code to join.'); },
    error(e){
      if (e && e.type === 'unavailable-id') { host.destroy(); return startHosting(); }
      if (e && (e.type === 'peer-unavailable')) return;   // a phone looked for a stale room; ignore
      netReady = false;
      setNet('Phones can’t connect right now (' + ((e && (e.type||e.message)) || 'network') + '). Refresh to retry, or play with the TV remote.');
    },
    connect(){},
    data: onClientMsg,
    close: onClientClose
  });
}
function setNet(t){ $('netStatus').textContent = t; }
function drawQR(){
  try {
    const q = qrcode(0, 'M'); q.addData(joinURL); q.make();
    $('qr').innerHTML = q.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
    $('qrSmall').innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
    const sv = $('qrSmall').querySelector('svg'); if (sv) sv.style.background = '#fff';
  } catch (e) { $('qr').textContent = joinURL; }
}

const teamCount = t => [...lobby.clients.values()].filter(c => c.team === t && c.connected).length;
function autoTeam(){
  let best = -1, bestN = 99;
  for (let t = 0; t < lobby.teamsN; t++){ const n = teamCount(t); if (n < MAX_PER_TEAM && n < bestN){ best = t; bestN = n; } }
  return best;
}
const cleanName = s => String(s || '').replace(/[<>&"]/g, '').trim().slice(0, 14) || 'Player';

function onClientMsg(conn, msg){
  if (!msg || typeof msg !== 'object') return;
  if (msg.t === 'hello'){
    const id = String(msg.id || '').slice(0, 40); if (!id) return;
    let c = lobby.clients.get(id);
    if (!c){
      const inGame = G && !G.over && mode === 'phones';
      const t = autoTeam();
      if (!inGame && t < 0){ conn.send({ t:'msg', text:'This game is full (6 players max).' }); return; }
      c = { id, name: cleanName(msg.name), team: t, conn, connected: true };
      lobby.clients.set(id, c);
    } else {
      c.conn = conn; c.connected = true; if (msg.name) c.name = cleanName(msg.name);
      if (G) { const s = G.seats.find(s => s.id === id); if (s){ s.name = c.name; } }
      if (c.team < 0 || c.team >= lobby.teamsN) c.team = autoTeam();
    }
    conn.clientId = id;
    toast(`${c.name} joined`);
    return refresh();
  }
  const c = lobby.clients.get(conn.clientId); if (!c || c.conn !== conn) return;
  const seatIdx = G ? G.seats.findIndex(s => s.id === c.id && s.kind === 'remote') : -1;
  switch (msg.t){
    case 'name': c.name = cleanName(msg.name); if (seatIdx >= 0) G.seats[seatIdx].name = c.name; return refresh();
    case 'team': {
      const t = msg.team | 0;
      if ((G && !G.over && seatIdx >= 0) || t < 0 || t >= lobby.teamsN) return;
      if (t !== c.team && teamCount(t) >= MAX_PER_TEAM) { conn.send({ t:'msg', text:'That team is full.' }); return; }
      c.team = t; return refresh();
    }
    case 'start': if (!G || G.over) { if (mode !== 'phones') mode = 'phones'; startPhoneGame(); } return;
    case 'lobby': if (G && G.over) backToLobby(); return;
    case 'select':
      if (G && !G.over && seatIdx === curSeatIdx()){
        const i = msg.i;
        G.preview = (Number.isInteger(i) && i >= 0 && i < G.seats[seatIdx].hand.length) ? i : null;
        renderGame();
      }
      return;
    case 'play': {
      if (!G || G.over || seatIdx !== curSeatIdx()) return;
      const s = G.seats[seatIdx], i = msg.i, r = msg.r, cc = msg.c;
      const card = s.hand[i]; if (!card) return;
      if (!legalTargets(card, s.team).some(([a,b]) => a === r && b === cc)) return sendView(c);
      return play(i, r, cc);
    }
    case 'swap': {
      if (!G || G.over || seatIdx !== curSeatIdx() || G.deadUsed) return;
      const s = G.seats[seatIdx], card = s.hand[msg.i];
      if (!card || !isDead(card, s.team)) return;
      swapDead(msg.i); G.preview = null;
      news(`${s.name} swapped a dead card`);
      renderGame(); broadcast();
      if (!anyPlayable(seatIdx)) { news(`${s.name} has no playable cards — turn passes`); setTimeout(endTurn, 1200); }
      return;
    }
  }
}
function onClientClose(conn){
  const c = lobby.clients.get(conn.clientId);
  if (!c || c.conn !== conn) return;
  c.connected = false; c.conn = null;
  const inGame = G && G.seats.some(s => s.id === c.id);
  if (!inGame) lobby.clients.delete(c.id);
  toast(`${c.name} disconnected`);
  refresh();
}

function lobbyView(c){
  return { t:'lobby', me:{ id:c.id, name:c.name, team:c.team }, teamsN: lobby.teamsN,
    inGame: !!(G && !G.over && mode === 'phones'), canStart: netReady,
    teams: COLORS.slice(0, lobby.teamsN).map((col, t) => ({ name: col.name, hex: col.hex,
      players: [...lobby.clients.values()].filter(x => x.team === t && x.connected).map(x => x.name) })) };
}
function stateFor(si){
  const s = G.seats[si], cur = curSeatIdx();
  return { t:'state',
    board: G.board.flat().map(x => x.chip === null ? -1 : x.chip + (x.locked ? 10 : 0)),
    teams: G.teams.map(t => ({ name:t.name, hex:t.hex, lt:t.lt, dk:t.dk, seqs:t.seqs, players:t.members.map(i => G.seats[i].name) })),
    target: G.target, me: { name: s.name, team: s.team },
    turn: { name: G.seats[cur].name, team: G.seats[cur].team },
    myTurn: cur === si && !G.over, deadUsed: G.deadUsed, last: G.last,
    hand: s.hand.map(card => ({ card, legal: legalTargets(card, s.team), dead: isDead(card, s.team) })),
    winner: G.over ? G.winner : null, news: G.news };
}
function sendView(c){
  if (!c.conn || !c.connected) return;
  const si = (G && mode === 'phones') ? G.seats.findIndex(s => s.id === c.id && s.kind === 'remote') : -1;
  c.conn.send(si >= 0 ? stateFor(si) : lobbyView(c));
}
function broadcast(){ lobby.clients.forEach(sendView); }
function refresh(){
  if (ui.screen === 'lobby') renderLobby();
  if (G) renderGame();
  broadcast();
}

// ---------------- Lobby ----------------
function lobbyItems(){
  return [
    { k:'teams', label:'Teams', val: lobby.teamsN === 2 ? '2 teams' : '3 teams' },
    { k:'start', label:'Start game', btn:true },
    { k:'local', label:'Play with TV remote only', btn:true },
    { k:'rules', label:'How to play', btn:true }
  ];
}
function renderLobby(){
  const clients = [...lobby.clients.values()].filter(c => c.connected);
  $('teamCols').innerHTML = COLORS.slice(0, lobby.teamsN).map((col, t) => {
    const mem = clients.filter(c => c.team === t);
    let slots = mem.map(c => `<div class="slot">${c.name}</div>`).join('');
    if (!mem.length) slots += `<div class="slot cpu">🤖 CPU plays this team</div><div class="slot empty">Waiting…</div>`;
    else for (let i = mem.length; i < MAX_PER_TEAM; i++) slots += `<div class="slot empty">Open seat</div>`;
    return `<div class="tcol" style="border-color:${col.hex}"><h3 style="color:${col.hex}">${col.name}</h3>${slots}</div>`;
  }).join('');
  $('lobbyMenu').innerHTML = lobbyItems().map((it, i) =>
    `<div class="opt${it.btn ? ' btn' : ''}${i === ui.lobbyIdx && ui.screen === 'lobby' ? ' focus' : ''}" data-i="${i}">${it.btn ? it.label : `<span>${it.label}</span><span class="val">◀ ${it.val} ▶</span>`}</div>`).join('');
}
function setTeams(n){
  const clients = [...lobby.clients.values()].filter(c => c.connected);
  if (n === 2 && clients.length > 4) { toast('Too many players for 2 teams — max 4'); return; }
  lobby.teamsN = n;
  clients.forEach(c => { if (c.team >= n) c.team = -1; });
  clients.forEach(c => { if (c.team < 0) c.team = autoTeam(); });
  refresh();
}
function lobbyActivate(k){
  switch (k){
    case 'teams': return setTeams(lobby.teamsN === 2 ? 3 : 2);
    case 'start': mode = 'phones'; return startPhoneGame();
    case 'local': return openMenu('local');
    case 'rules': ui.prevMenu = null; return openMenu('rules');
  }
}
function showScreen(s){
  ui.screen = s;
  $('lobby').classList.toggle('hidden', s !== 'lobby');
  $('app').classList.toggle('hidden', s === 'lobby');
  if (s === 'lobby') renderLobby();
}
function backToLobby(){ G = null; mode = 'phones'; closeMenu(); showScreen('lobby'); refresh(); }

// ---------------- Game setup ----------------
function startPhoneGame(){
  const clients = [...lobby.clients.values()].filter(c => c.connected);
  if (!clients.length) { toast('Scan the QR code with a phone to join first'); return; }
  clients.forEach(c => { if (c.team < 0 || c.team >= lobby.teamsN) c.team = autoTeam(); });
  const teams = [], seats = [];
  for (let t = 0; t < lobby.teamsN; t++){
    const team = { ...COLORS[t], seqs: 0, members: [] };
    const mem = clients.filter(c => c.team === t).slice(0, MAX_PER_TEAM);
    if (!mem.length) { seats.push({ id:null, name:'CPU', team:t, kind:'cpu', hand:[] }); team.members.push(seats.length - 1); }
    mem.forEach(c => { seats.push({ id:c.id, name:c.name, team:t, kind:'remote', hand:[] }); team.members.push(seats.length - 1); });
    teams.push(team);
  }
  mode = 'phones';
  newGame(teams, seats);
}
function startLocalGame(){
  const teams = [], seats = [];
  for (let t = 0; t < localCfg.teamsN; t++){
    const human = localCfg.kinds[t] === 'Human';
    seats.push({ id:null, name: COLORS[t].name, team:t, kind: human ? 'local' : 'cpu', hand:[] });
    teams.push({ ...COLORS[t], seqs:0, members:[t] });
  }
  mode = 'local';
  newGame(teams, seats);
}
function newGame(teams, seats){
  const board = LAYOUT.map((row, r) => row.map((card, c) => ({ card, chip:null, locked:false, corner:isCorner(r,c) })));
  G = { teams, seats, board, deck: makeDeck(), discard: [], teamTurn: 0, ptr: teams.map(() => 0),
        target: teams.length === 2 ? 2 : 1, over:false, winner:null, deadUsed:false, last:null, preview:null,
        news: null, mode:'hand', handIdx:0, cur:[4,4], sel:null, busy:false };
  const size = HAND_SIZE[seats.length] || 5;
  for (let i = 0; i < size; i++) seats.forEach(s => s.hand.push(draw()));
  closeMenu(); showScreen('game');
  $('handBox').classList.toggle('hidden', mode === 'phones');
  $('joinBox').classList.toggle('hidden', mode !== 'phones');
  startTurn();
}
function draw(){ if (!G.deck.length) { G.deck = shuffle(G.discard); G.discard = []; } return G.deck.pop() || null; }
const curSeatIdx = () => G.teams[G.teamTurn].members[G.ptr[G.teamTurn]];
const localHumans = () => G.seats.filter(s => s.kind === 'local').length;
function news(text){ G.news = { id: ++newsId, text }; toast(text); }

function legalTargets(card, team){
  const out = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++){
    const x = G.board[r][c]; if (x.corner) continue;
    if (isTwoEyed(card)) { if (x.chip === null) out.push([r,c]); }
    else if (isOneEyed(card)) { if (x.chip !== null && x.chip !== team && !x.locked) out.push([r,c]); }
    else if (x.card === card && x.chip === null) out.push([r,c]);
  }
  return out;
}
const isDead = (card, team) => !isJack(card) && legalTargets(card, team).length === 0;
const anyPlayable = si => G.seats[si].hand.some(c => legalTargets(c, G.seats[si].team).length > 0);
const hasDeadSwap = si => !G.deadUsed && G.seats[si].hand.some(c => isDead(c, G.seats[si].team));

// ---------------- Lineups ----------------
function owns(r, c, t){ const x = G.board[r][c]; return x.corner || x.chip === t; }
function checkSequences(t, r, c){
  let made = 0;
  for (const [dr, dc] of DIRS){
    let sr = r, sc = c;
    while (sr-dr >= 0 && sr-dr < N && sc-dc >= 0 && sc-dc < N && owns(sr-dr, sc-dc, t)) { sr -= dr; sc -= dc; }
    const run = []; let x = sr, y = sc;
    while (x >= 0 && x < N && y >= 0 && y < N && owns(x, y, t)) { run.push([x,y]); x += dr; y += dc; }
    if (run.length < 5) continue;
    const at = run.findIndex(([a,b]) => a === r && b === c);
    for (let s = Math.max(0, at-4); s <= Math.min(at, run.length-5); s++){
      const win = run.slice(s, s+5);
      const overlap = win.filter(([a,b]) => { const q = G.board[a][b]; return q.locked && q.chip === t; }).length;
      if (overlap <= 1) { win.forEach(([a,b]) => { const q = G.board[a][b]; if (!q.corner) q.locked = true; }); made++; }
    }
  }
  return made;
}

// ---------------- Turn flow ----------------
function startTurn(){
  if (G.over) return;
  G.deadUsed = false; G.preview = null; G.sel = null; G.mode = 'hand'; G.handIdx = 0;
  const si = curSeatIdx(), s = G.seats[si], team = G.teams[s.team];
  G.busy = s.kind !== 'local';
  renderGame(); broadcast();
  const who = `<b style="color:${team.hex}">${s.kind === 'cpu' && s.name === 'CPU' ? team.name + ' CPU' : s.name}</b>`;
  if (s.kind === 'cpu') { setStatus(`${who} is thinking…`); setTimeout(cpuMove, 1100); return; }
  if (!anyPlayable(si) && !hasDeadSwap(si)) { news(`${s.name} has no playable cards — turn passes`); setTimeout(endTurn, 1400); return; }
  if (s.kind === 'remote') {
    const c = lobby.clients.get(s.id);
    setStatus(`${who}’s turn — play from your phone.` + (c && c.connected ? '' : '<br><small style="color:#fca5a5">Disconnected — scan the code to rejoin, or press Back for options.</small>'));
    return;
  }
  if (localHumans() > 1) showPass();
  else setStatus(`Your turn, ${who}. Pick a card.`);
}
function play(handIdx, r, c){
  const si = curSeatIdx(), s = G.seats[si], team = G.teams[s.team];
  const card = s.hand.splice(handIdx, 1)[0];
  G.discard.push(card);
  const x = G.board[r][c];
  let msg = '';
  if (isOneEyed(card)) { const victim = G.teams[x.chip]; x.chip = null; msg = `${s.name} removed a ${victim.name} chip`; }
  else {
    x.chip = s.team;
    const made = checkSequences(s.team, r, c);
    if (made) { team.seqs += made; msg = `${team.name} made a LINEUP! (${team.seqs}/${G.target})`; }
  }
  G.last = [r, c];
  const nc = draw(); if (nc) s.hand.push(nc);
  if (msg) news(msg);
  if (team.seqs >= G.target) { G.over = true; G.winner = s.team; G.busy = true; renderGame(); broadcast(); return showWin(s.team); }
  endTurn();
}
function endTurn(){
  if (!G || G.over) return;
  const t = G.teamTurn;
  G.ptr[t] = (G.ptr[t] + 1) % G.teams[t].members.length;
  G.teamTurn = (t + 1) % G.teams.length;
  startTurn();
}
function swapDead(handIdx){
  const s = G.seats[curSeatIdx()];
  G.discard.push(s.hand.splice(handIdx, 1)[0]);
  const nc = draw(); if (nc) s.hand.push(nc);
  G.deadUsed = true;
}

// ---------------- CPU ----------------
const W = [1,4,15,60,1000], B = [0,3,12,50,600];
function cellValue(r, c, t){
  let v = 0;
  for (const [dr, dc] of DIRS){
    for (let k = 0; k < 5; k++){
      const sr = r-dr*k, sc = c-dc*k, er = sr+dr*4, ec = sc+dc*4;
      if (sr<0||sr>=N||sc<0||sc>=N||er<0||er>=N||ec<0||ec>=N) continue;
      let mine = 0, corner = 0, opp = 0; const oppSet = new Set();
      for (let i = 0; i < 5; i++){
        const a = sr+dr*i, b = sc+dc*i; if (a === r && b === c) continue;
        const q = G.board[a][b];
        if (q.corner) corner++; else if (q.chip === t) mine++; else if (q.chip !== null) { opp++; oppSet.add(q.chip); }
      }
      if (opp === 0) v += W[Math.min(mine+corner, 4)];
      else if (mine === 0 && oppSet.size === 1) v += B[Math.min(opp+corner, 4)];
    }
  }
  return v + (4.5-Math.abs(r-4.5) + 4.5-Math.abs(c-4.5)) * 0.3;
}
function removeValue(r, c){ const q = G.board[r][c], owner = q.chip; q.chip = null; const v = cellValue(r, c, owner); q.chip = owner; return v * 0.9; }
function cpuMove(){
  if (!G || G.over) return;
  const si = curSeatIdx(), s = G.seats[si];
  if (s.kind !== 'cpu') return;
  if (!G.deadUsed) { const d = s.hand.findIndex(c => isDead(c, s.team)); if (d >= 0) swapDead(d); }
  let best = null;
  s.hand.forEach((card, i) => {
    for (const [r, c] of legalTargets(card, s.team)){
      let v;
      if (isOneEyed(card)) v = removeValue(r, c) - 45;
      else { v = cellValue(r, c, s.team); if (isTwoEyed(card)) v -= 35; }
      v += Math.random() * 1.5;
      if (!best || v > best.v) best = { v, i, r, c };
    }
  });
  if (!best) { news(`${s.name} has no move — turn passes`); return endTurn(); }
  play(best.i, best.r, best.c);
}

// ---------------- Rendering ----------------
function renderGame(){
  if (!G) return;
  const si = curSeatIdx(), s = G.seats[si];
  const localTurn = s.kind === 'local' && !G.busy;
  let selCard = null;
  if (localTurn && G.sel !== null) selCard = s.hand[G.sel];
  else if (s.kind === 'remote' && G.preview !== null) selCard = s.hand[G.preview];
  const legal = selCard ? new Set(legalTargets(selCard, s.team).map(([r,c]) => r + ',' + c)) : null;
  let h = '';
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++){
    const x = G.board[r][c], cls = ['cell'];
    if (x.corner) cls.push('corner'); else if (isRed(x.card)) cls.push('red');
    if (legal) cls.push(legal.has(r + ',' + c) ? 'legal' : 'dim');
    if (localTurn && G.mode === 'board' && G.cur[0] === r && G.cur[1] === c) cls.push('cursor');
    if (G.last && G.last[0] === r && G.last[1] === c) cls.push('last');
    const face = x.corner ? '<span class="star">★</span><span class="free">FREE</span>' : `<span class="rk">${rankOf(x.card)}</span><span class="st">${SUITS[suitOf(x.card)]}</span>`;
    const t = x.chip !== null ? G.teams[x.chip] : null;
    const chip = t ? `<div class="chip${x.locked ? ' locked' : ''}" style="background:radial-gradient(circle at 35% 30%,${t.lt},${t.hex} 50%,${t.dk})"></div>` : '';
    h += `<div class="${cls.join(' ')}" data-r="${r}" data-c="${c}">${face}${chip}</div>`;
  }
  $('board').innerHTML = h;

  $('scores').innerHTML = G.teams.map((t, ti) => {
    const mem = t.members.map(i => {
      const m = G.seats[i];
      const off = m.kind === 'remote' && !(lobby.clients.get(m.id) || {}).connected;
      const nm = m.kind === 'cpu' ? '🤖 ' + m.name : m.name;
      return i === si && !G.over ? `<b>▶ ${nm}</b>` : `<span class="${off ? 'off' : ''}">${nm}${off ? ' ⚠' : ''}</span>`;
    }).join(' · ');
    return `<div class="team${ti === s.team && !G.over ? ' active' : ''}"><div class="dot" style="background:${t.hex}"></div><div class="who"><div class="tname">${t.name}</div><div class="mem">${mem}</div></div><div class="seq">${t.seqs} / ${G.target}</div></div>`;
  }).join('');

  if (mode === 'local'){
    const viewer = (s.kind === 'local' && ui.screen !== 'pass') ? s : (localHumans() === 1 ? G.seats.find(q => q.kind === 'local') : null);
    if (viewer) {
      $('hand').innerHTML = viewer.hand.map((card, i) => {
        const cls = ['hc']; if (isRed(card)) cls.push('red');
        let tag = '';
        if (isTwoEyed(card)) tag = '<span class="tag">Wild</span>';
        else if (isOneEyed(card)) tag = '<span class="tag">Remove</span>';
        else if (isDead(card, viewer.team)) { tag = '<span class="tag">Dead</span>'; cls.push('dead'); }
        if (viewer === s && localTurn) { if (G.sel === i) cls.push('selected'); else if (G.mode === 'hand' && G.handIdx === i) cls.push('focus'); }
        return `<div class="${cls.join(' ')}" data-i="${i}"><span class="rk">${rankOf(card)}</span><span class="st">${SUITS[suitOf(card)]}</span>${tag}</div>`;
      }).join('');
    } else $('hand').innerHTML = s.hand.map(() => '<div class="hc back"></div>').join('');
    $('hint').innerHTML = G.mode === 'board'
      ? '<kbd>◀ ▲ ▼ ▶</kbd> move &nbsp; <kbd>OK</kbd> place &nbsp; <kbd>Back</kbd> change card'
      : '<kbd>◀ ▶</kbd> choose card &nbsp; <kbd>OK</kbd> select &nbsp; <kbd>Back</kbd> menu';
  } else {
    $('hint').innerHTML = '<kbd>Back</kbd> menu';
  }
}
function setStatus(html){ $('status').innerHTML = html; }
let toastT;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.remove('hidden'); t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => { t.style.opacity = 0; setTimeout(() => t.classList.add('hidden'), 300); }, 2400); }
function shakeCursor(){ const el = document.querySelector('.cell.cursor'); if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); } }

// ---------------- Menus ----------------
function menuItems(){
  switch (ui.menuKind){
    case 'local': {
      const items = [{ k:'lteams', label:'Teams', val: localCfg.teamsN }];
      for (let i = 0; i < localCfg.teamsN; i++) items.push({ k:'kind' + i, label: COLORS[i].name, val: localCfg.kinds[i] });
      items.push({ k:'lstart', label:'Start game', btn:true }, { k:'tolobby', label:'Back', btn:true });
      return items;
    }
    case 'pause': {
      const items = [{ k:'resume', label:'Resume', btn:true }, { k:'rules', label:'How to play', btn:true }];
      if (mode === 'phones' && G && G.seats.some(s => s.kind === 'remote' && !(lobby.clients.get(s.id) || {}).connected))
        items.push({ k:'cpuoff', label:'CPU plays for disconnected players', btn:true });
      items.push({ k:'tolobby', label: mode === 'phones' ? 'End game (back to lobby)' : 'Quit to lobby', btn:true });
      return items;
    }
    case 'win': return [{ k:'again', label:'Play again', btn:true }, { k:'tolobby', label:'Back to lobby', btn:true }];
    case 'rules': return [{ k:'back', label:'Got it', btn:true }];
    case 'pass': return [{ k:'ready', label:"I'm ready — show my cards", btn:true }];
  }
  return [];
}
let menuHeader = '';
function openMenu(kind, header){
  if (kind === 'rules') ui.prevMenu = ui.menuKind;
  ui.menuKind = kind; ui.menuIdx = 0; menuHeader = header || '';
  if (kind === 'pass') ui.screen = 'pass';
  $('menu').classList.remove('hidden'); drawMenu();
}
function closeMenu(){ ui.menuKind = null; $('menu').classList.add('hidden'); if (ui.screen === 'pass') ui.screen = 'game'; if (G && ui.screen !== 'lobby') renderGame(); else if (ui.screen === 'lobby') renderLobby(); }
function drawMenu(){
  const items = menuItems();
  let head = menuHeader;
  if (ui.menuKind === 'local') head = `<h2>TV remote only</h2><p>Everyone shares the TV. Hands are hidden between turns.</p>`;
  if (ui.menuKind === 'rules') head = `<h2>How to play</h2><ul class="rules">
    <li>On your turn, pick a card from your hand and place a chip on a matching space (each card appears twice on the board).</li>
    <li>Get five chips in a row — across, down, or diagonal — to make a <b>Lineup</b>. The four corners are free for everyone.</li>
    <li><b>Wild</b> jacks (♦ ♣) go on any open space. <b>Remove</b> jacks (♥ ♠) take an opponent's chip off — but not one in a finished Lineup.</li>
    <li>A <b>Dead</b> card has both spaces taken: swap it for a new one (once per turn).</li>
    <li>2 teams need <b>2 Lineups</b> to win; 3 teams need <b>1</b>. Teammates take turns and can't show each other their cards.</li></ul><br>`;
  $('menuBox').innerHTML = head + items.map((it, i) =>
    `<div class="opt${it.btn ? ' btn' : ''}${i === ui.menuIdx ? ' focus' : ''}" data-i="${i}">${it.btn ? it.label : `<span>${it.label}</span><span class="val">◀ ${it.val} ▶</span>`}</div>`).join('');
}
function menuChange(){
  const it = menuItems()[ui.menuIdx];
  if (it.k === 'lteams') localCfg.teamsN = localCfg.teamsN === 2 ? 3 : 2;
  else if (it.k.startsWith('kind')) { const i = +it.k.slice(4); localCfg.kinds[i] = localCfg.kinds[i] === 'Human' ? 'CPU' : 'Human'; }
  drawMenu();
}
function menuActivate(){
  const it = menuItems()[ui.menuIdx]; if (!it) return;
  switch (it.k){
    case 'lteams': case 'kind0': case 'kind1': case 'kind2': return menuChange();
    case 'lstart': return startLocalGame();
    case 'tolobby': return backToLobby();
    case 'rules': return openMenu('rules');
    case 'back': { const p = ui.prevMenu; if (p) return openMenu(p, p === 'pause' ? '<h2>Paused</h2>' : ''); return closeMenu(); }
    case 'resume': return closeMenu();
    case 'cpuoff':
      G.seats.forEach(s => { if (s.kind === 'remote' && !(lobby.clients.get(s.id) || {}).connected) { s.kind = 'cpu'; s.name += ' (CPU)'; } });
      closeMenu();
      if (G.seats[curSeatIdx()].kind === 'cpu') { G.busy = true; setTimeout(cpuMove, 600); }
      return refresh();
    case 'again': return mode === 'phones' ? startPhoneGame() : startLocalGame();
    case 'ready': { closeMenu(); const s = G.seats[curSeatIdx()]; renderGame(); setStatus(`Your turn, <b style="color:${G.teams[s.team].hex}">${s.name}</b>. Pick a card.`); return; }
  }
}
function showPass(){ const s = G.seats[curSeatIdx()], t = G.teams[s.team]; openMenu('pass', `<h2 style="color:${t.hex}">${s.name}'s turn</h2><p>Pass the remote to ${s.name}. Everyone else, look away from the cards!</p>`); renderGame(); }
function showWin(ti){ const t = G.teams[ti]; const names = t.members.map(i => G.seats[i].name).join(' & '); openMenu('win', `<h1 style="color:${t.hex}">${t.name} wins!</h1><p>${names}</p>`); }

// ---------------- Input (TV remote) ----------------
const KEY = { LEFT:[37,'ArrowLeft'], UP:[38,'ArrowUp'], RIGHT:[39,'ArrowRight'], DOWN:[40,'ArrowDown'],
              OK:[13,'Enter',' '], BACK:[8,27,10009,461,'Backspace','Escape','BrowserBack','GoBack'] };
const is = (e, k) => KEY[k].includes(e.keyCode) || KEY[k].includes(e.key);
document.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  const k = ['LEFT','UP','RIGHT','DOWN','OK','BACK'].find(x => is(e, x));
  if (!k) return;
  e.preventDefault();
  if (ui.menuKind) return onMenuKey(k);
  if (ui.screen === 'lobby') return onLobbyKey(k);
  if (!G || G.over) return;
  if (k === 'BACK' && (mode === 'phones' || G.mode === 'hand' || G.busy)) return openMenu('pause', '<h2>Paused</h2>');
  if (mode !== 'local' || G.busy || G.seats[curSeatIdx()].kind !== 'local') return;
  if (G.mode === 'hand') onHandKey(k); else onBoardKey(k);
});
function onLobbyKey(k){
  const n = lobbyItems().length;
  if (k === 'UP') ui.lobbyIdx = (ui.lobbyIdx - 1 + n) % n;
  else if (k === 'DOWN') ui.lobbyIdx = (ui.lobbyIdx + 1) % n;
  else if (k === 'LEFT' || k === 'RIGHT') { if (lobbyItems()[ui.lobbyIdx].k === 'teams') return lobbyActivate('teams'); }
  else if (k === 'OK') return lobbyActivate(lobbyItems()[ui.lobbyIdx].k);
  renderLobby();
}
function onMenuKey(k){
  const n = menuItems().length;
  if (k === 'UP') ui.menuIdx = (ui.menuIdx - 1 + n) % n;
  else if (k === 'DOWN') ui.menuIdx = (ui.menuIdx + 1) % n;
  else if (k === 'LEFT' || k === 'RIGHT') return menuChange();
  else if (k === 'OK') return menuActivate();
  else if (k === 'BACK') {
    if (ui.menuKind === 'pause') return closeMenu();
    if (ui.menuKind === 'rules') return menuActivate.call(null, ui.menuIdx = 0);
    if (ui.menuKind === 'local') return closeMenu();
  }
  drawMenu();
}
function onHandKey(k){
  const s = G.seats[curSeatIdx()], n = s.hand.length;
  if (k === 'LEFT') G.handIdx = (G.handIdx - 1 + n) % n;
  else if (k === 'RIGHT') G.handIdx = (G.handIdx + 1) % n;
  else if (k === 'UP' || k === 'DOWN') G.handIdx = Math.max(0, Math.min(n - 1, G.handIdx + (k === 'DOWN' ? 4 : -4)));
  else if (k === 'OK') return selectCard(G.handIdx);
  renderGame();
}
function selectCard(i){
  const si = curSeatIdx(), s = G.seats[si], card = s.hand[i];
  if (isDead(card, s.team)){
    if (G.deadUsed) { toast('You already swapped a dead card this turn'); return; }
    swapDead(i); toast('Dead card swapped for a new one'); G.handIdx = Math.min(G.handIdx, s.hand.length - 1);
    renderGame();
    if (!anyPlayable(si)) { toast('No playable cards — turn passes'); endTurn(); }
    return;
  }
  const targets = legalTargets(card, s.team);
  if (!targets.length) { toast(isOneEyed(card) ? 'No opponent chips can be removed' : 'Nowhere to play that card'); return; }
  G.sel = i; G.mode = 'board';
  const [cr, cc] = G.cur;
  targets.sort((a, b) => (Math.abs(a[0]-cr) + Math.abs(a[1]-cc)) - (Math.abs(b[0]-cr) + Math.abs(b[1]-cc)));
  G.cur = [...targets[0]];
  setStatus(isOneEyed(card) ? 'Choose an opponent chip to <b>remove</b>.' : isTwoEyed(card) ? 'Wild! Place your chip on <b>any</b> open space.' : 'Place your chip on a highlighted space.');
  renderGame();
}
function onBoardKey(k){
  const [r, c] = G.cur;
  if (k === 'BACK') { G.mode = 'hand'; G.sel = null; setStatus('Pick a card.'); return renderGame(); }
  const s = G.seats[curSeatIdx()], card = s.hand[G.sel], legal = legalTargets(card, s.team);
  if (k === 'OK') { if (legal.some(([a,b]) => a === r && b === c)) return play(G.sel, r, c); return shakeCursor(); }
  const d = { LEFT:[0,-1], RIGHT:[0,1], UP:[-1,0], DOWN:[1,0] }[k];
  let best = null, bestD = 1e9;
  for (const [a, b] of legal){
    const along = (a-r)*d[0] + (b-c)*d[1]; if (along <= 0) continue;
    const across = Math.abs((a-r)*d[1]) + Math.abs((b-c)*d[0]);
    const sc = along + across * 2.5; if (sc < bestD) { bestD = sc; best = [a,b]; }
  }
  if (best && legal.length <= 12) G.cur = best;
  else G.cur = [Math.max(0, Math.min(N-1, r+d[0])), Math.max(0, Math.min(N-1, c+d[1]))];
  renderGame();
}

// Mouse / touch (handy on a computer)

  G.cur = [+el.dataset.r, +el.dataset.c]; onBoardKey('OK'); if (G && !G.over) renderGame();
});

  G.mode = 'hand'; G.sel = null; G.handIdx = +el.dataset.i; selectCard(G.handIdx);
});
$('menuBox').addEventListener('click', e => { const el = e.target.closest('.opt'); if (!el) return; ui.menuIdx = +el.dataset.i; menuActivate(); });
$('lobbyMenu').addEventListener('click', e => { const el = e.target.closest('.opt'); if (!el) return; ui.lobbyIdx = +el.dataset.i; lobbyActivate(lobbyItems()[ui.lobbyIdx].k); });

// Testing hook
window.__lineup = { get G(){ return G; }, get room(){ return roomCode; }, get joinURL(){ return joinURL; }, lobby };

showScreen('lobby');
startHosting();
})();
